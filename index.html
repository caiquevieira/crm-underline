<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM</title>
<script>try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  /* tema: claro em :root, escuro (padrão) em [data-theme=dark]; o botão ☀/☾ alterna */
  :root { color-scheme: light; --borda:#d9dee5; --fundo:#f6f7f9; --texto:#1f2933; --suave:#6b7280; --azul:#2563eb; --vermelho:#dc2626; --ambar:#d97706;
    --cartao:#fff; --cabeca:var(--cabeca); --linha:var(--linha); --borda-forte:var(--borda-forte); --hover:var(--hover); --sutil:var(--sutil); --chip:var(--chip); --apagado:var(--apagado);
    --link:#2563eb; --verde:var(--verde); --bg-vermelho:var(--bg-vermelho); --bg-ambar:var(--bg-ambar); --bg-invalido:var(--bg-invalido); --bg-azul:var(--bg-azul); --borda-vermelha:var(--borda-vermelha);
    --txt-vermelho:var(--txt-vermelho); --txt-ambar:var(--txt-ambar); --tooltip:#1f2933; --tinta2:#52514e; --grade:#e1e0d9; --eixo:var(--eixo); }
  :root[data-theme="dark"] { color-scheme: dark; --borda:#2c323b; --fundo:#000; --texto:#e6e8eb; --suave:#9aa3ae; --azul:#2f6fed; --vermelho:#e5484d; --ambar:#d98a0b;
    --cartao:#111418; --cabeca:#181c21; --linha:#20252c; --borda-forte:#38404b; --hover:#1d2229; --sutil:#14181d; --chip:#272d35; --apagado:#636b76;
    --link:#7cb3ff; --verde:#4ade80; --bg-vermelho:#3a1416; --bg-ambar:#352508; --bg-invalido:#4a1a1f; --bg-azul:#13274a; --borda-vermelha:#7f2a2e;
    --txt-vermelho:#fecaca; --txt-ambar:#fde68a; --tooltip:#2a3039; --tinta2:#b4b2a9; --grade:#2a2e34; --eixo:#4a4f57; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 14px system-ui, "Segoe UI", sans-serif; color: var(--texto); background: var(--fundo); }
  button { font: inherit; color: var(--texto); padding: 5px 10px; border: 1px solid var(--borda); background: var(--cartao); border-radius: 6px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
  button.icone { border: 0; background: none; padding: 2px 6px; color: var(--suave); }
  button.icone:hover { color: var(--vermelho); background: var(--bg-vermelho); }
  button:disabled { opacity: .4; cursor: default; }
  input, select { font: inherit; color: inherit; }
  .espaco { flex: 1; }

  header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--cartao); border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
  header strong { font-size: 16px; margin-right: 8px; }
  .listas { display: flex; gap: 8px; align-items: center; min-width: 0; }
  #abas { display: flex; gap: 4px; flex-wrap: wrap; }
  #abas button.ativa { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
  #status { font-size: 12px; color: var(--suave); }
  #status.erro { color: var(--vermelho); font-weight: 600; }

  #aviso { margin: 8px 14px 0; padding: 10px 14px; border-radius: 6px; background: var(--bg-vermelho); border: 1px solid var(--borda-vermelha); color: var(--txt-vermelho); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #aviso[hidden] { display: none; }

  #resumo { display: flex; gap: 12px; align-items: stretch; padding: 10px 14px 0; flex-wrap: wrap; }
  .funil { display: flex; flex: 1; gap: 3px; min-width: 0; align-items: stretch; }
  .degrau { flex: 1 1 0; min-width: 64px; padding: 6px 8px; border-radius: 4px; overflow: hidden; white-space: nowrap; display: flex; flex-direction: column; justify-content: flex-end; }
  .degrau b { display: block; font-size: 18px; line-height: 1.1; }
  .degrau b small { font-size: 12px; font-weight: 600; opacity: .8; margin-left: 5px; }
  .degrau span { font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; }
  .degrau.vazio { opacity: .45; }
  .grupo-oferta { display: flex; flex-direction: column; gap: 3px; padding: 3px; border: 1px dashed #94a3b8; border-radius: 6px; min-width: 0; }
  .grupo-oferta .topo { font-size: 11px; color: var(--suave); padding: 0 4px; white-space: nowrap; }
  .grupo-oferta .topo b { color: var(--texto); font-size: 13px; }
  .grupo-oferta .etapas { display: flex; gap: 3px; flex: 1; }
  .atrasados, .cartao { padding: 6px 12px; border-radius: 4px; background: var(--cartao); border: 1px solid var(--borda); text-align: center; white-space: nowrap; display: flex; flex-direction: column; justify-content: center; }
  .atrasados.tem { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  .atrasados { cursor: pointer; }
  .atrasados.alerta.tem { background: var(--ambar); border-color: var(--ambar); }
  .atrasados b, .cartao b { display: block; font-size: 18px; line-height: 1.1; }
  .atrasados span, .cartao span { font-size: 11px; }
  .cartao span { color: var(--suave); }

  .barra { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
  #busca { padding: 5px 10px; border: 1px solid var(--borda); border-radius: 6px; width: 240px; }
  #contagem { color: var(--suave); font-size: 12px; }

  #tabelaWrap { flex: 1; overflow: auto; margin: 0 14px 14px; background: var(--cartao); border: 1px solid var(--borda); border-radius: 6px; }
  table.dados { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  .dados th, .dados td { border-bottom: 1px solid var(--linha); border-right: 1px solid var(--linha); padding: 0; vertical-align: middle; }
  .dados thead th { position: sticky; background: var(--cabeca); z-index: 2; text-align: left; font-weight: 600; }
  /* primeira coluna fixa ao rolar para os lados */
  .dados thead th:first-child { left: 0; z-index: 3; }
  .dados tbody td:first-child:not([colspan]) { position: sticky; left: 0; z-index: 1; background: var(--cartao); }
  .dados th:first-child, .dados tbody td:first-child:not([colspan]) { border-right-color: var(--borda-forte); }
  .dados thead tr:first-child th { top: 0; padding: 7px 8px; cursor: pointer; user-select: none; white-space: nowrap; }
  .dados thead tr:nth-child(2) th { top: 33px; padding: 3px; }
  .dados thead th .seta { color: var(--azul); }
  .filtro { width: 100%; padding: 3px 5px; border: 1px solid var(--borda); border-radius: 4px; font-size: 12px; background: var(--cartao); font-weight: normal; }
  button.filtro.multi { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; color: var(--suave); }
  button.filtro.multi::after { content: ' ▾'; }
  button.filtro.multi.ativo { color: var(--azul); border-color: var(--azul); background: var(--bg-azul); font-weight: 600; }
  #menuFiltro { position: fixed; margin: 0; inset: auto; padding: 6px; border: 1px solid var(--borda); border-radius: 6px; background: var(--cartao); box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 60vh; overflow: auto; font-size: 13px; }
  #menuFiltro .mf-topo { display: flex; gap: 6px; padding: 0 0 6px; margin-bottom: 4px; border-bottom: 1px solid var(--linha); }
  #menuFiltro .mf-topo button { padding: 2px 8px; font-size: 12px; }
  #menuFiltro label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  #menuFiltro label:hover { background: var(--hover); }
  #menuFiltro label span { flex: 1; }
  #menuFiltro label small { color: var(--suave); }
  .dados td input[type=text], .dados td select { width: 100%; border: 1px solid transparent; background: transparent; padding: 6px 7px; border-radius: 0; }
  .dados td input[type=text]:hover, .dados td select:hover { border-color: var(--borda); }
  .dados td input[type=text]:focus, .dados td select:focus { border-color: var(--azul); background: var(--cartao); outline: none; }
  .dados td input[type=checkbox] { display: block; margin: 0 auto; width: 16px; height: 16px; }
  .dados td input::placeholder { color: transparent; }
  .dados td input:focus::placeholder { color: var(--apagado); }
  .dados td input.invalido { border-color: var(--vermelho); background: var(--bg-invalido); }
  .dados td select.etapa { font-weight: 600; }
  .dados td .dias { display: block; padding: 6px 8px; text-align: right; color: var(--suave); }
  .comLink { display: flex; align-items: center; }
  .comLink a { padding: 0 8px; text-decoration: none; font-size: 13px; white-space: nowrap; }
  .comLink a.whats { color: var(--verde); font-weight: 600; font-size: 11px; }
  .t-texto, .t-proxima_acao { min-width: 170px; }
  .t-url { min-width: 230px; }
  .t-selecao { min-width: 140px; }
  .t-telefone { min-width: 230px; }
  .t-etapa { min-width: 160px; }
  .t-data, .t-etapa_desde, .t-data_proxima_acao { width: 105px; }
  .t-numero { width: 90px; }
  .t-numero input { text-align: right; }
  .t-caixa { width: 60px; }
  .t-dias_na_etapa { width: 70px; }
  td.acoes { width: 60px; text-align: center; white-space: nowrap; }
  button.icone.abrir:hover { color: var(--azul); background: var(--bg-azul); }
  tr.atrasado td, .dados tbody tr.atrasado td:first-child { background: var(--bg-vermelho); }
  tr.atrasado td:first-child { box-shadow: inset 3px 0 0 var(--vermelho); }
  tr.alerta td, .dados tbody tr.alerta td:first-child { background: var(--bg-ambar); }
  tr.alerta td:first-child { box-shadow: inset 3px 0 0 var(--ambar); }
  tr.grupo td { padding: 6px 10px; font-weight: 600; background: var(--sutil); }
  tr.grupo .bolinha { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  tr.grupo .n { color: var(--suave); font-weight: normal; margin-left: 6px; }
  td.nada { padding: 24px; text-align: center; color: var(--suave); }

  dialog { background: var(--cartao); color: var(--texto); border: 1px solid var(--borda); border-radius: 8px; padding: 0; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  dialog::backdrop { background: rgba(15,23,42,.35); }
  #caixa form { padding: 18px; min-width: min(340px, 86vw); display: flex; flex-direction: column; gap: 12px; }
  #caixa p { margin: 0; white-space: pre-line; }
  #caixa input, #caixa select { padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; }
  .botoes { display: flex; justify-content: flex-end; gap: 8px; }

  #gerenciador { width: min(1100px, 96vw); max-height: 92vh; }
  .g-topo { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--borda); position: sticky; top: 0; background: var(--cartao); z-index: 2; }
  .g-topo h2 { margin: 0; font-size: 16px; flex: 1; }
  .g-corpo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 16px 18px; }
  .g-corpo h3 { margin: 0 0 8px; font-size: 14px; }
  .g-corpo table { border-collapse: collapse; width: 100%; }
  .g-corpo td { padding: 3px 3px; vertical-align: middle; }
  .g-corpo td input[type=text], .g-corpo select { width: 100%; padding: 4px 6px; border: 1px solid var(--borda); border-radius: 4px; }
  .g-corpo input[type=color] { width: 34px; height: 28px; padding: 0 2px; border: 1px solid var(--borda); border-radius: 4px; background: var(--cartao); }
  .g-corpo .mover { white-space: nowrap; width: 1%; }
  .g-corpo .mover button { padding: 2px 6px; }
  .g-corpo button { white-space: nowrap; }
  .g-corpo select { min-width: 92px; }
  .g-corpo .sis { font-size: 11px; color: var(--suave); }
  .g-corpo .uso { font-size: 12px; color: var(--suave); white-space: nowrap; }
  .g-corpo tr.opcoes > td { background: var(--sutil); padding: 8px 10px 10px 40px; }
  .adicionar { display: flex; gap: 6px; margin-top: 10px; }
  .adicionar input { flex: 1; padding: 5px 8px; border: 1px solid var(--borda); border-radius: 6px; }
  .adicionar select { padding: 5px 8px; border: 1px solid var(--borda); border-radius: 6px; }

  .visoes { display: flex; margin-left: 6px; }
  #btnTema { padding: 5px 9px; }
  .visoes button { border-radius: 0; }
  .visoes button:first-child { border-radius: 6px 0 0 6px; }
  .visoes button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .visoes button.ativa { background: var(--azul); border-color: var(--azul); color: #fff; }
  .barra[hidden], #tabelaWrap[hidden], #cartoes[hidden], #graficos[hidden], #hoje[hidden] { display: none; }

  /* aba Hoje */
  #hoje { flex: 1; overflow: auto; padding: 10px 14px 14px; }
  .bloco { margin-bottom: 18px; }
  .bloco h2 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .bloco h2 .n { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--chip); }
  .bloco h2 small { font-weight: normal; color: var(--suave); font-size: 12px; }
  .bloco.vermelho h2 .n { background: var(--vermelho); color: #fff; }
  .bloco.ambar h2 .n { background: var(--ambar); color: #fff; }
  .bloco.azul h2 .n { background: var(--azul); color: #fff; }
  .bloco > .nada { margin: 0; padding: 10px 12px; color: var(--suave); font-size: 13px; background: var(--cartao); border: 1px dashed var(--borda); border-radius: 6px; }
  .item { display: grid; grid-template-columns: minmax(230px, 1.1fr) minmax(360px, 2fr) auto; gap: 8px 14px; align-items: center;
    background: var(--cartao); border: 1px solid var(--borda); border-left-width: 4px; border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; }
  .vermelho .item { border-left-color: var(--vermelho); }
  .ambar .item { border-left-color: var(--ambar); }
  .azul .item { border-left-color: var(--azul); }
  .cinza .item { border-left-color: #94a3b8; }
  .item .emp { min-width: 0; }
  .item .emp b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--suave); }
  .item .meta select.etapa { font: inherit; font-weight: 600; border: 0; border-radius: 4px; padding: 2px 4px; }
  .item .meta .detalhe { color: var(--texto); font-weight: 600; }
  .item .acao { display: flex; gap: 6px; }
  .item .acao input { padding: 5px 7px; border: 1px solid var(--borda); border-radius: 4px; min-width: 0; }
  .item .acao input.txt { flex: 1; }
  .item .acao input.dt { width: 100px; }
  .item .acao input.invalido { border-color: var(--vermelho); background: var(--bg-invalido); }
  .links { display: flex; gap: 6px; white-space: nowrap; }
  .links a { font-size: 12px; text-decoration: none; padding: 4px 8px; border: 1px solid var(--borda); border-radius: 4px; color: var(--link); }
  .links a.whats { color: var(--verde); font-weight: 600; }
  .links .falta { font-size: 11px; color: var(--apagado); padding: 4px 2px; }
  .item .mover { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .item .mover button.perigo { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  @media (max-width: 1000px) { .item { grid-template-columns: 1fr; } }

  /* tabelas de conversão (aba Gráficos) */
  table.conv { width: 100%; border-collapse: collapse; font-size: 12px; }
  .conv th, .conv td { padding: 5px 8px; border-bottom: 1px solid var(--linha); text-align: left; white-space: nowrap; }
  .conv thead th { color: var(--tinta2); font-weight: 600; }
  .conv th:not(:first-child), .conv td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .conv tfoot td { font-weight: 600; border-top: 1px solid var(--eixo); border-bottom: 0; }
  .card .rolar { overflow-x: auto; }
  .card.largo { grid-column: 1 / -1; }
  .tiles.dinheiro .tile b { font-size: 24px; }
  .g-corpo input.curto { width: 70px; padding: 4px 6px; border: 1px solid var(--borda); border-radius: 4px; }

  /* gráficos: cores validadas (dataviz) — venda, em oferta, antes da oferta, perdido */
  #graficos { --s-venda: #1baf7a; --s-oferta: #eb6834; --s-antes: #2a78d6; --s-perdido: #e34948;
    flex: 1; overflow: auto; padding: 10px 14px 14px; }
  .g-nota { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--suave); margin-bottom: 10px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--cartao); border: 1px solid var(--borda); border-radius: 8px; padding: 12px 14px; }
  .tile span { display: block; font-size: 12px; color: var(--tinta2); }
  .tile b { display: block; font-size: 28px; font-weight: 600; line-height: 1.25; }
  .tile small { font-size: 12px; color: var(--suave); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 12px; }
  .card { background: var(--cartao); border: 1px solid var(--borda); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .card h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card h3 select { font: inherit; font-size: 13px; font-weight: 600; padding: 2px 4px; border: 1px solid var(--borda); border-radius: 4px; }
  .card .sub { margin: 2px 0 12px; font-size: 12px; color: var(--suave); }
  .card .vazio { color: var(--suave); font-size: 13px; padding: 16px 0; }
  .legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tinta2); margin-bottom: 10px; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .hb { display: grid; grid-template-columns: minmax(80px, max-content) 1fr; gap: 6px 10px; align-items: center; font-size: 12px; }
  .hb .rot { text-align: right; color: var(--tinta2); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .trilho { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .hb .barras { display: flex; gap: 2px; height: 18px; }
  .hb .seg { height: 100%; min-width: 3px; }
  .hb .seg:last-child { border-radius: 0 4px 4px 0; }
  .hb .val { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hb .val small { color: var(--suave); margin-left: 4px; }
  .colunas { display: flex; align-items: flex-end; gap: 4px; height: 170px; border-bottom: 1px solid var(--eixo); padding-top: 18px; }
  .colunas .col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; min-width: 0; }
  .colunas .col .c { width: min(24px, 80%); background: var(--s-antes); border-radius: 4px 4px 0 0; }
  .colunas .col .n { font-size: 11px; font-variant-numeric: tabular-nums; }
  .eixo-x { display: flex; gap: 4px; margin-top: 4px; }
  .eixo-x span { flex: 1; text-align: center; font-size: 10px; color: var(--suave); white-space: nowrap; overflow: hidden; }
  #dica { position: fixed; z-index: 20; pointer-events: none; background: var(--tooltip); color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: pre-line; max-width: 280px; }
  #dica[hidden] { display: none; }

  /* serviços vendidos */
  .t-servicos { min-width: 240px; }
  .sv-celula { display: block; width: 100%; max-width: 360px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 0; padding: 6px 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sv-celula:hover { border-color: var(--borda); background: var(--cartao); }
  .sv-celula .sv-total { color: var(--suave); }
  .sv-celula.vazio { color: var(--apagado); }
  .servicos { display: flex; flex-direction: column; gap: 6px; }
  .sv-item { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(90px, .7fr) minmax(100px, .8fr) auto; gap: 6px; align-items: center; }
  .sv-item select, .sv-item input { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; background: var(--cartao); }
  .sv-item input { text-align: right; }
  .sv-item input.invalido { border-color: var(--vermelho); background: var(--bg-invalido); }
  .sv-rodape { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .sv-rodape select { padding: 6px 8px; border: 1px dashed var(--azul); border-radius: 6px; color: var(--azul); background: var(--cartao); }
  .sv-soma { font-weight: 600; }
  .sv-vazio { margin: 0; color: var(--suave); font-size: 13px; }
  #dlgServicos { width: min(640px, 96vw); }
  .sv-corpo { padding: 16px 18px; }

  /* ficha do registro (todas as colunas num formulário) */
  #ficha { width: min(760px, 96vw); max-height: 92vh; }

<body>

<script>
'use strict';
const TIPOS = { texto: 'Texto', numero: 'Número', data: 'Data', selecao: 'Seleção', url: 'URL', telefone: 'Telefone', caixa: 'Caixa de seleção', servicos: 'Serviços (com valores)' };
const COBRANCA = { unico: 'Único', mensal: 'Mensal' };
const celular = matchMedia('(max-width: 700px)'); // tela estreita: registros em cartões em vez da tabela
const SISTEMA = { etapa: 'etapa', proxima_acao: 'próxima ação', data_proxima_acao: 'data da próxima ação', etapa_desde: 'automática', dias_na_etapa: 'automática' };
const TIPOS_DATA = ['data', 'etapa_desde', 'data_proxima_acao'];
const TIPOS_ETAPA = { aberta: 'Aberta', ganha: 'Ganha', perdida: 'Perdida' };
const CORES = ['#60a5fa', '#38bdf8', '#a78bfa', '#f472b6', '#fbbf24', '#fb923c', '#34d399', '#94a3b8'];

let D = null;            // { listas, mtime } vindo do servidor
let atual = 0;           // índice da lista aberta
let V = { busca: '', filtros: {}, ordem: null, dir: 1, agrupar: false };
let sujo = false, salvando = false, pendente = false, timer = null;
let opcoesAbertas = null; // coluna com o editor de opções aberto no gerenciador

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
function el(tag, props = {}, ...filhos) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...filhos.filter(f => f != null));
  return e;
}
const L = () => D.listas[atual];
const colDo = tipo => L().colunas.find(c => c.tipo === tipo);
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const mesmoNome = (a, b) => a.toLowerCase() === b.toLowerCase();
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const hoje = () => iso(new Date());
const ehData = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
function br(s) { return ehData(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : (s ?? ''); }
function deBR(t) { // '' -> null, inválida -> undefined
  t = t.trim();
  if (!t) return null;
  const m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/.exec(t);
  if (!m) return undefined;
  let a = m[3] ? +m[3] : new Date().getFullYear();
  if (a < 100) a += 2000;
  const d = new Date(a, m[2] - 1, m[1]);
  return d.getMonth() === m[2] - 1 && d.getDate() === +m[1] ? iso(d) : undefined;
}
function dias(s) {
  if (!ehData(s)) return null;
  const t = new Date(), [a, m, d] = s.split('-').map(Number);
  return Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(a, m - 1, d)) / 864e5);
}
function deNumero(t) { // '' -> null, inválido -> undefined
  t = String(t).trim();
  if (!t) return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = Number(t);
  return Number.isFinite(n) ? n : undefined;
}
function urlCompleta(v) {
  v = v.trim();
  if (/^https?:\/\//i.test(v)) return v;
  return /^[a-z][a-z0-9+.-]*:/i.test(v) ? null : 'https://' + v;
}
function whats(v) {
  let n = v.replace(/\D/g, '');
  if (n.length === 10 || n.length === 11) n = '55' + n;
  return n.length >= 10 ? 'https://wa.me/' + n : null;
}
function corTexto(hex) {
  const n = parseInt((hex || '#999999').slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#111827' : '#ffffff';
}
// ---------- regras do funil ----------
const etapaDe = r => L().etapas.find(e => e.nome === r[colDo('etapa').nome]);
// fase: "producao" (antes do contato), "ativa" (venda ativa) ou "final" (ganha/perdida)
const fase = e => !e ? null : e.tipo !== 'aberta' ? 'final' : e.producao ? 'producao' : 'ativa';
const faseDe = r => fase(etapaDe(r));
const ehRecusa = r => { const e = etapaDe(r); return !!(e && e.tipo === 'perdida' && e.oferta); }; // perdida depois da oferta
const colPor = re => L().colunas.find(c => re.test(c.nome));
const colMotivo = () => colPor(/^motivo/i);
const colFim = () => colPor(/^data fim$/i);
const colValor = () => L().colunas.find(c => c.tipo === 'numero' && /valor/i.test(c.nome));
const colMensal = () => L().colunas.find(c => c.tipo === 'numero' && /mensal/i.test(c.nome) && c !== colValor());
const colWhats = () => L().colunas.find(c => c.tipo === 'telefone');

// ---------- serviços vendidos ----------
// Coluna do tipo "servicos": cada registro tem uma lista de itens { servico, cobranca: 'unico'|'mensal', valor? }.
// O catálogo (c.servicos) tem o preço sugerido de cada serviço; o valor negociado fica no item.
const colServicos = () => L().colunas.find(c => c.tipo === 'servicos');
const itensDe = r => { const c = colServicos(); return c && Array.isArray(r[c.nome]) ? r[c.nome] : []; };
const catalogo = (c, nome) => (c.servicos || []).find(s => s.nome === nome);
const itemDe = s => ({ servico: s.nome, cobranca: s.cobranca, ...(typeof s.preco === 'number' ? { valor: s.preco } : {}) });
function somaItens(itens) {
  const s = { unico: 0, mensal: 0 };
  for (const i of itens) if (typeof i.valor === 'number') s[i.cobranca === 'mensal' ? 'mensal' : 'unico'] += i.valor;
  return s;
}
// { unico, mensal } do registro; lista sem coluna de serviços usa a coluna numérica "Valor" como valor único
// e a numérica "Mensal…" (ex.: Mensalidade) como valor mensal
function valoresDe(r) {
  if (colServicos()) return somaItens(itensDe(r));
  const n = c => c && typeof r[c.nome] === 'number' ? r[c.nome] : 0;
  return { unico: n(colValor()), mensal: n(colMensal()) };
}
function somaValores(lista, fn = valoresDe) {
  const s = { unico: 0, mensal: 0 };
  for (const r of lista) { const v = fn(r); s.unico += v.unico; s.mensal += v.mensal; }
  return s;
}
function fmtValores(v, vazio = '–') {
  const p = [v.unico ? brl(v.unico) : null, v.mensal ? brl(v.mensal) + '/mês' : null].filter(Boolean);
  return p.length ? p.join(' + ') : vazio;
}
const fmtItem = i => `${i.servico}: ${typeof i.valor === 'number' ? brl(i.valor) + (i.cobranca === 'mensal' ? '/mês' : '') : 'valor a definir'}`;
const resumoServicos = itens => itens.length ? itens.map(i => i.servico).join(' + ') + ' · ' + fmtValores(somaItens(itens), 'a definir') : '';
function nomesServicos(c) { // catálogo + nomes usados nos registros que não estão nele
  const ns = (c.servicos || []).map(s => s.nome);
  for (const r of L().registros) for (const i of r[c.nome] || []) if (!ns.includes(i.servico)) ns.push(i.servico);
  return ns;
}
// valores de um registro para os filtros de várias opções (serviços: um por item)
function valoresFiltro(r, c) {
  if (c.tipo === 'caixa') return [r[c.nome] ? 'sim' : 'não'];
  if (c.tipo === 'servicos') { const ns = (r[c.nome] || []).map(i => i.servico); return ns.length ? ns : ['__vazio']; }
  return [r[c.nome] || '__vazio'];
}

// editor dos itens de um registro: serviço, cobrança e valor negociado
function editorServicos(r, c) {
  const caixa = el('div', { className: 'servicos' });
  const lista = () => Array.isArray(r[c.nome]) ? r[c.nome] : [];
  const total = el('span', { className: 'sv-soma' });
  const mostrarTotal = () => { total.textContent = lista().length ? 'Total: ' + fmtValores(somaItens(lista()), 'a definir') : ''; };
  const mudou = () => { if (!lista().length) delete r[c.nome]; mostrarTotal(); salvar(); renderResumo(); };
  const opcoes = atual => { const ns = (c.servicos || []).map(s => s.nome); if (atual && !ns.includes(atual)) ns.push(atual); return ns.map(n => el('option', { value: n, textContent: n })); };
  const desenhar = () => {
    const linhas = lista().map((it, i) => {
      const sNome = el('select', { className: 'sv-nome', title: 'Serviço', onchange: () => {
        it.servico = sNome.value;
        const s = catalogo(c, it.servico);
        if (s) { it.cobranca = s.cobranca; if (it.valor == null && typeof s.preco === 'number') it.valor = s.preco; }
        mudou(); desenhar();
      } }, ...opcoes(it.servico));
      sNome.value = it.servico;
      const sCob = el('select', { title: 'Cobrança', onchange: () => { it.cobranca = sCob.value; mudou(); } },
        ...Object.entries(COBRANCA).map(([v, t]) => el('option', { value: v, textContent: t })));
      sCob.value = it.cobranca === 'mensal' ? 'mensal' : 'unico';
      const valor = el('input', { type: 'text', inputMode: 'decimal', placeholder: 'R$ a definir', title: 'Valor negociado (R$)',
        value: it.valor == null ? '' : String(it.valor).replace('.', ','), onchange: () => {

const API_URL = 'https://script.google.com/macros/s/AKfycbzjk_m9IE3p-xj7FRaqcpQIy53M-3ZeBLOyFG84pfatNJKey_Gkj9Xf2N2cvL5KLgTD/exec'; // App da Web do Apps Script; vazio = pergunta ao conectar

async function api(acao, corpo = {}) {
  if (LOCAL) {
    const res = acao === 'ler' ? await fetch('/api/dados')
      : await fetch('/api/salvar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    return { ok: res.ok, status: res.status, j: await res.json() };
  }

async function carregar(perguntar = true) {
  if (perguntar && sujo && !await confirmar(`Há alterações que ainda não foram gravadas ${ONDE}.\nRecarregar e descartá-las?`)) return;
  let j;
  try {
    const r = await api('ler');

    if (r.status === 401 || r.status === 403) return pedirConexao(r.status === 403 ? 'Chave de acesso inválida. Confira e digite de novo.' : null);
    if (!r.ok) throw new Error(j.erro);
  } catch (e) {
    mostrarAviso('Não consegui carregar os dados: ' + (e.message && !/fetch/i.test(e.message) ? e.message
      : LOCAL ? 'o servidor não respondeu. Abra de novo o iniciar.bat.' : 'sem conexão com a planilha. Confira a internet e clique em Recarregar.'));

async function enviar(forcar = false) {
  clearTimeout(timer);
  if (salvando) { pendente = true; return; }
  salvando = true; pendente = false; mostrarStatus('Salvando…');
  let res = null, j = {};
  try {
    res = await api('salvar', { mtime: D.mtime, listas: D.listas, contatos: D.contatos, forcar });
    j = res.j;
  } catch (e) { res = null; }

    timer = setTimeout(enviar, 5000);
  } else if (res.status === 409) {
    mostrarAviso(j.erro + ' O que fazer?',
      el('button', { textContent: 'Recarregar (perde o que mudei aqui)', onclick: () => carregar(false) }),
      el('button', { textContent: 'Gravar por cima com o que está na tela', onclick: () => enviar(true) }));
  } else {
    mostrarAviso((j.erro || 'Erro ao salvar.') + ' Corrija e a gravação será tentada de novo.');
  }
}

  ];
  const datas = l.colunas.filter(c => c.tipo === 'data');
  if (datas.length >= 2) { // como o SLA da planilha: fim − início (ou hoje − início), sem os perdidos
    const [ini, fim] = datas.map(c => c.nome);
    const v = rs.filter(r => situacao(r) !== 'perdido' && ehData(r[ini])).map(r => dias(r[ini]) - (ehData(r[fim]) ? dias(r[fim]) : 0));
    if (v.length) tiles.push(tile('Tempo médio', num(v.reduce((a, b) => a + b, 0) / v.length, 1) + ' dias', `${ini} → ${fim} (ou hoje)`,
      `Média de ${v.length} registro(s) não perdidos com "${ini}" preenchida`));
  }

  // R$: receita fechada (única e mensal), pipeline ativo e ponderado, taxa de ganho
  const cs = colServicos(), soma = lista => somaValores(lista);
  const ganhos = rs.filter(r => etapaDe(r)?.tipo === 'ganha'), recusas = rs.filter(ehRecusa);
  const fechados = ganhos.length + recusas.length, taxaGeral = fechados ? ganhos.length / fechados : 0;
  const ativos = rs.filter(r => faseDe(r) === 'ativa');
  // taxa por etapa = vendas / (vendas + recusas) entre os leads que, pelo histórico, passaram pela etapa
  const MIN_HISTORICO = 5;
  const passou = new Map();
  for (const h of l.historico || []) for (const n of [h.de, h.para]) if (n) (passou.get(n) || passou.set(n, new Set()).get(n)).add(h.id);
  const porId = new Map(rs.map(r => [r._id, r]));
  const taxaEtapa = nome => {
    let g = 0, p = 0;
    for (const id of passou.get(nome) || []) { const r = porId.get(id); if (!r) continue; if (etapaDe(r)?.tipo === 'ganha') g++; else if (ehRecusa(r)) p++; }
    return g + p >= MIN_HISTORICO ? { taxa: g / (g + p), propria: true, n: g + p } : { taxa: taxaGeral, propria: false, n: g + p };
  };
  const ponderado = { unico: 0, mensal: 0 };
  const usouGeral = [], detalhePond = [];
  for (const e of l.etapas.filter(e => fase(e) === 'ativa')) {
    const t = taxaEtapa(e.nome), s = soma(ativos.filter(r => r[ce] === e.nome));
    ponderado.unico += s.unico * t.taxa; ponderado.mensal += s.mensal * t.taxa;
    if (!t.propria) usouGeral.push(e.nome);
    detalhePond.push(`${e.nome}: ${fmtValores(s, brl(0))} × ${pct(t.taxa * 100, 100)} ${t.propria ? `(histórico de ${t.n})` : `(taxa geral; histórico de ${t.n})`}`);
  }
  const rec = soma(ganhos), pipe = soma(ativos);
  const maisMensal = v => v.mensal ? `+ ${brl(v.mensal)}/mês · ` : '';
  const tilesDinheiro = [
    tile('Receita fechada', brl(rec.unico), `${ganhos.length} venda${ganhos.length === 1 ? '' : 's'}`,
      cs ? 'Soma dos serviços de cobrança única nas vendas' : colValor() ? `Soma de "${colValor().nome}" nas vendas` : 'Crie uma coluna de Serviços em "Colunas e etapas"'),
    cs || colMensal() ? tile('Recorrente fechado', brl(rec.mensal) + '/mês', cs ? 'serviços mensais vendidos' : `"${colMensal().nome}" das vendas`,
      cs ? 'Soma dos serviços de cobrança mensal nas vendas' : `Soma de "${colMensal().nome}" nas vendas`) : null,
    tile('Pipeline ativo', brl(pipe.unico), `${maisMensal(pipe)}${ativos.length} leads em venda ativa`),
    tile('Pipeline ponderado', '≈ ' + brl(ponderado.unico),
      maisMensal(ponderado) + (usouGeral.length ? `⚠ taxa geral (${pct(ganhos.length, fechados)}) em ${usouGeral.length} etapa${usouGeral.length > 1 ? 's' : ''}: histórico insuficiente` : 'taxa histórica de cada etapa'),
      `Cada etapa ativa × taxa de conversão para venda. Precisa de ${MIN_HISTORICO} leads fechados que passaram pela etapa; senão usa a taxa geral.\n` + detalhePond.join('\n')),
    tile('Taxa de ganho', fechados ? pct(ganhos.length, fechados) : '–', `${ganhos.length} vendas / ${fechados} (vendas + recusas)`,
      'Vendas ÷ (vendas + recusas). Não conta desqualificados nem leads em produção.'),
  ];

  // 1. leads por etapa
  const porEtapa = contarPor(rs, r => r[ce]);
  const c1 = card('Leads por etapa', 'Quantidade e % sobre os leads', barrasH(l.etapas.map(e => {
    const q = porEtapa.get(e.nome) || 0;
    return { rotulo: e.nome, segs: [{ n: q, cor: cor('antes'), dica: `${e.nome}: ${q} (${pct(q, rs.length)} dos leads)` }], extra: pct(q, rs.length) };
  })));

  // 2. resultado por dimensão (coluna de seleção escolhida)
  const dims = l.colunas.filter(c => c.tipo === 'selecao' || c.tipo === 'servicos');
  const cards = [c1];
  if (dims.length) {
    if (!dims.some(c => c.nome === dimGrafico)) dimGrafico = (dims.find(c => /segmento/i.test(c.nome)) || dims[0]).nome;
    const sel = el('select', { onchange: ev => { dimGrafico = ev.target.value; renderGraficos(); } }, ...dims.map(c => el('option', { value: c.nome, textContent: c.nome })));
    sel.value = dimGrafico;
    const dim = dims.find(c => c.nome === dimGrafico), grupos = new Map();
    for (const r of rs) {
      for (const k of new Set(valoresFiltro(r, dim).map(v => v === '__vazio' ? '(vazio)' : v))) { // serviços: o lead entra em cada um
        if (!grupos.has(k)) grupos.set(k, []);
        grupos.get(k).push(r);
      }
    }
    const linhas = [...grupos].sort((a, b) => (a[0] === '(vazio)') - (b[0] === '(vazio)') || b[1].length - a[1].length).map(([k, lista]) => {
      const s = contarPor(lista, situacao), q = x => s.get(x) || 0;
      return { rotulo: k, segs: SITUACOES.map(([x, nome]) => ({ n: q(x), cor: cor(x), dica: `${k} — ${nome}: ${q(x)}\nTotal: ${lista.length} · vendas: ${q('venda')}` })),
        extra: q('venda') ? `${q('venda')} venda${q('venda') > 1 ? 's' : ''}` : '' };
    });
    cards.push(card(['Resultado por', sel], 'Onde cada lead está hoje',
      el('div', { className: 'legenda' }, ...SITUACOES.map(([x, nome]) => { const i = el('i'); i.style.background = cor(x); return el('span', {}, i, nome); })),
      barrasH(linhas)));
  }

  // 3. motivos das perdas
  const cm = l.colunas.find(c => /motivo/i.test(c.nome));
  if (cm) {
    const perdidos = rs.filter(r => situacao(r) === 'perdido');
    // sem motivo preenchido: agrupa pelo nome da etapa (ex.: "Desqualificado"), no fim da lista
    const semMotivo = new Set(perdidos.filter(r => !r[cm.nome]).map(r => r[ce]));
    const m = [...contarPor(perdidos, r => r[cm.nome] || r[ce])].sort((a, b) => semMotivo.has(a[0]) - semMotivo.has(b[0]) || b[1] - a[1]);
    cards.push(card('Motivos das perdas', `${perdidos.length} perdido(s): recusas e desqualificados`,
      m.length ? barrasH(m.map(([k, q]) => ({ rotulo: k, segs: [{ n: q, cor: cor('perdido'), dica: `${k}${semMotivo.has(k) ? ' (sem motivo preenchido)' : ''}: ${q} (${pct(q, perdidos.length)} das perdas)` }], extra: pct(q, perdidos.length) })))
        : el('p', { className: 'vazio', textContent: 'Nenhuma perda.' })));
  }

  // 4. novos leads por semana (1ª coluna de data)
  if (datas.length) {
    const cd = datas[0].nome, comData = rs.filter(r => ehData(r[cd]));
    const segunda = s => { const [a, m, d] = s.split('-').map(Number), x = new Date(a, m - 1, d); x.setDate(d - (x.getDay() + 6) % 7); return iso(x); };
    const porSemana = contarPor(comData, r => segunda(r[cd]));
    const semanas = [];
    if (comData.length) {
      const ord = [...porSemana.keys()].sort();
      const x = new Date(ord[0] + 'T00:00'), fimS = new Date(segunda(hoje()) + 'T00:00');
      for (; x <= fimS; x.setDate(x.getDate() + 7)) semanas.push(iso(x));
    }
    const ultimas = semanas.slice(-16), maxS = Math.max(1, ...ultimas.map(s => porSemana.get(s) || 0));
    cards.push(card('Novos leads por semana', `Pela coluna "${cd}" — ${comData.length} de ${rs.length} registros têm essa data`,
      ultimas.length ? el('div', {},
        el('div', { className: 'colunas' }, ...ultimas.map(s => {
          const q = porSemana.get(s) || 0, c = el('div', { className: 'c' });
          c.style.height = `calc(${q / maxS} * (100% - 20px))`;
          return el('div', { className: 'col' },el('span', { className: 'n', textContent: q || '' }), c);
        })),
        el('div', { className: 'eixo-x' }, ...ultimas.map(s => el('span', { textContent: br(s).slice(0, 5) }))))
        : el('p', { className: 'vazio', textContent: 'Nenhum registro com data.' })));
    // dica por coluna (área inteira da coluna, maior que a barra)
    const cols = cards.at(-1).querySelectorAll('.col');
    ultimas.forEach((s, i) => { if (cols[i]) cols[i].dataset.dica = `Semana de ${br(s)}: ${porSemana.get(s) || 0} lead(s)`; });
  }

  // 5. conversão por segmento e por origem
  const etSemResposta = l.etapas.find(e => /sem resposta/i.test(e.nome));
  // um grupo por valor da coluna (serviços: um por item); valorNo(r, k): receita do registro no grupo k (k null = linha Total)
  function tabelaConversao(c, valorNo = r => valoresDe(r)) {
    const grupos = new Map();
    for (const r of rs) for (const k of new Set(valoresFiltro(r, c).map(v => v === '__vazio' ? '(vazio)' : v))) (grupos.get(k) || grupos.set(k, []).get(k)).push(r);
    const linhaDe = (k, lista, total) => {
      const g = lista.filter(r => etapaDe(r)?.tipo === 'ganha'), p = lista.filter(ehRecusa).length;
      const sr = etSemResposta ? lista.filter(r => r[ce] === etSemResposta.nome).length : 0, rec = somaValores(g, r => valorNo(r, total ? null : k));
      return el('tr', {}, el('td', { textContent: k }), ...[lista.length, g.length, p, sr].map(n => el('td', { textContent: n })),
        el('td', { textContent: g.length + p ? pct(g.length, g.length + p) : '–' }), el('td', { textContent: fmtValores(rec) }));
    };
    const ord = [...grupos].sort((a, b) => (a[0] === '(vazio)') - (b[0] === '(vazio)') || b[1].length - a[1].length);
    return el('div', { className: 'rolar' }, el('table', { className: 'conv' },
      el('thead', {}, el('tr', {}, ...[c.nome, 'Leads', 'Vendas', 'Recusas', 'Sem resposta', 'Taxa de ganho', 'Receita'].map(t => el('th', { textContent: t })))),
      el('tbody', {}, ...ord.map(([k, lista]) => linhaDe(k, lista))),
      el('tfoot', {}, linhaDe('Total', rs, true))));
  }
  const conversoes = [colPor(/^segmento$/i), colPor(/^origem$/i)].filter(Boolean).map(c => card(`Conversão por ${c.nome}`, 'Taxa de ganho = vendas ÷ (vendas + recusas)', tabelaConversao(c)));
  if (cs) conversoes.unshift(card(`Conversão por serviço`, 'Lead com vários serviços conta em cada um; a receita de cada linha soma só os itens daquele serviço',
    tabelaConversao(cs, (r, k) => k == null ? valoresDe(r) : somaItens(itensDe(r).filter(i => i.servico === k)))));
  for (const k of conversoes) { k.classList.add('largo'); cards.push(k); }

  // 6. funil de produção: quem está em produção e quantos já viraram contato
  const etProd = l.etapas.filter(e => fase(e) === 'producao');
  if (etProd.length) {
    const nomesProd = new Set(etProd.map(e => e.nome)), cl = colLink();
    const saiuPeloHistorico = new Set((l.historico || []).filter(h => nomesProd.has(h.de)).map(h => h.id));
    const viraram = rs.filter(r => faseDe(r) !== 'producao' && (saiuPeloHistorico.has(r._id) ||
      (cl && r[cl.nome] && (faseDe(r) === 'ativa' || etapaDe(r)?.tipo === 'ganha' || ehRecusa(r)))));
    const emProducao = rs.filter(r => faseDe(r) === 'producao').length, base = emProducao + viraram.length;
    cards.push(card('Funil de produção', `${viraram.length} de ${base} LPs produzidas já viraram contato (${pct(viraram.length, base)})`,
      barrasH([...etProd.map(e => { const q = porEtapa.get(e.nome) || 0; return { rotulo: e.nome, segs: [{ n: q, cor: cor('antes'), dica: `Em ${e.nome}: ${q}` }] }; }),
        { rotulo: 'Já viraram contato', segs: [{ n: viraram.length, cor: cor('venda'),
          dica: `${viraram.length} leads que saíram da produção: pelo histórico de etapas ou por terem "${cl ? cl.nome : 'link da LP'}" e estarem em venda ativa, venda ou recusa` }] }])));
  }

  g.replaceChildren(nota, el('div', { className: 'tiles dinheiro' }, ...tilesDinheiro), el('div', { className: 'tiles' }, ...tiles), el('div', { className: 'cards' }, ...cards));
}

// ---------- aba Hoje ----------
function renderHoje() {
  const l = L(), ce = colDo('etapa').nome, cd = colDo('data_proxima_acao').nome, h = hoje();
  const naoFinal = l.registros.filter(r => faseDe(r) !== 'final');
  const atrasados = naoFinal.filter(r => ehData(r[cd]) && r[cd] < h).sort((a, b) => a[cd].localeCompare(b[cd]));
  const paraHoje = naoFinal.filter(r => r[cd] === h);
  const semAcao = l.registros.filter(semProximaAcao);
  const excesso = r => diasNaEtapa(r) - etapaDe(r).limite;
  const parados = l.registros.filter(parado).sort((a, b) => excesso(b) - excesso(a));
  $('#hoje').replaceChildren(
    blocoHoje('Atrasados', 'vermelho', atrasados, 'mais antigos primeiro', r => `venceu em ${br(r[cd])} (há ${dias(r[cd])} dia${dias(r[cd]) === 1 ? '' : 's'})`),
    blocoHoje('Para hoje', 'azul', paraHoje),
    blocoHoje('Ativos sem próxima ação', 'ambar', semAcao, 'venda ativa sem próxima ação ou sem data'),
    blocoHoje('Leads parados', 'cinza', parados, 'passaram do limite de dias da etapa — limites em "Colunas e etapas"',
      r => `${diasNaEtapa(r)} dias em ${r[ce]} (limite ${etapaDe(r).limite})`, true));
}
function blocoHoje(titulo, tom, lista, sub, detalhe, comMover) {

function itemHoje(r, detalhe, comMover) {

  etapa.className = 'etapa'; pintar(etapa, r[ce]); etapa.title = historicoTexto(r);

  const amanha = () => { const d = new Date(); d.setDate(d.getDate() + 1); dt.value = br(iso(d)); };

      el('div', { className: 'meta' }, etapa, d == null ? null : el('span', { textContent: `${d} dia${d === 1 ? '' : 's'} na etapa` }),
        itens.length ? el('span', { textContent: resumoServicos(itens), title: itens.map(fmtItem).join('\n') }) : null,
        detalhe ? el('span', { className: 'detalhe', textContent: detalhe }) : null)),
    el('form', { className: 'acao', onsubmit: gravarAcao }, txt, dt,
      el('button', { type: 'button', textContent: 'Amanhã', title: 'Usar a data de amanhã', onclick: amanha }),
      el('button', { className: 'primario', textContent: 'Salvar' })),
    el('div', { className: 'links' }, ...linksDe(r, true),

  if (comMover) item.append(moverParaRecusa(r, nome));

// WhatsApp, Abordagem e link da LP; comFalta: mostra "sem WhatsApp"/"sem LP" quando não houver

// "Mover para Recusa (Sem retorno)", com confirmação na própria página
function moverParaRecusa(r, nome) {
  const destino = L().etapas.find(e => /^recusa$/i.test(e.nome)) || L().etapas.find(e => e.tipo === 'perdida');
  if (!destino) return null;
  const caixa = el('div', { className: 'mover' });
  const normal = () => caixa.replaceChildren(el('button', { type: 'button', textContent: `Mover para ${destino.nome} (Sem retorno)`, onclick: perguntar }));
  const perguntar = () => caixa.replaceChildren(el('span', { textContent: `Mover "${nome}" para ${destino.nome} com motivo "Sem retorno"?` }),
    el('button', { type: 'button', className: 'perigo', textContent: 'Sim, mover', onclick: () => {
      aplicarEtapa(r, destino.nome);
      const cm = colMotivo();
      if (cm && !r[cm.nome]) {
        r[cm.nome] = 'Sem retorno';
        if (cm.tipo === 'selecao' && !cm.opcoes.includes('Sem retorno')) cm.opcoes.push('Sem retorno');
      }
      salvar(); render(); toast(`"${nome}" movido para ${destino.nome}.`, false);
    } }),
    el('button', { type: 'button', textContent: 'Cancelar', onclick: normal }));
  normal();
  return caixa;
}

// ---------- parcerias (contabilidades, advocacias...) ----------
// Duas listas com papel fixo (guardado em _Config; vale mesmo se a lista for renomeada). "Parcerias" é o registro
// master (o segmento diz se é contabilidade, advocacia...) e cada registro de "Clientes" aponta para um parceiro
// pelo _id, numa coluna do tipo "vinculo".
// Contatos (vários por registro) ficam fora das colunas, em D.contatos (aba _Contatos):
// { _id, tipo, ref, nome, cargo, telefone, email, obs }, com tipo = singular do papel e ref = _id do registro.
// Para ligar uma lista nova depois (ex.: Demandas de um cliente): um papel aqui com pai: 'clientes'.

const PAPEIS = {

const listaDo = papel => D.listas.find(l => l.papel === papel);
const colTipo = (l, tipo) => l.colunas.find(c => c.tipo === tipo);
const nomeReg = (l, r) => r[l.colunas[0].nome] || '(sem nome)';
const etapaNa = (l, r) => l.etapas.find(e => e.nome === r[colTipo(l, 'etapa').nome]);

const listaPai = (l = L()) => listaDo(PAPEIS[l.papel]?.pai);
function rotuloVinculo(l, id) {

// valores do filtro de vínculo: registros da lista pai + _ids que não existem mais
function idsVinculo(c) {

  for (const r of L().registros) if (r[c.nome] && !ids.includes(r[c.nome])) ids.push(r[c.nome]);
  return ids;
}
function clientesDe(r) {
  const lc = listaDo('clientes'), cv = lc && colVinculo(lc);
  return cv ? lc.registros.filter(x => x[cv.nome] === r._id) : [];
}

// Cria as listas da parceria que faltarem (só com Codigo.gs / server.py novos). Devolve true se criou.
function garantirParceria() {
  let criou = false;
  for (const [papel, p] of Object.entries(PAPEIS)) {
    if (listaDo(papel)) continue;
    let nome = p.nome;
    for (let i = 2; D.listas.some(l => mesmoNome(l.nome, nome)); i++) nome = `${p.nome} ${i}`;
    const colunas = [...p.colunas, ['Próxima ação', 'proxima_acao'], ['Data da próxima ação', 'data_proxima_acao'], ['Etapa desde', 'etapa_desde'], ['Dias na etapa', 'dias_na_etapa']];
    D.listas.push({ nome, papel, registros: [], historico: [],
      colunas: colunas.map(([nome, tipo, opcoes = []]) => ({ nome, tipo, opcoes: [...opcoes], visivel: true })), etapas: p.etapas.map(e => ({ ...e })) });
    criou = true;
  }
  return criou;
}

// muda para a lista l e abre a ficha de r (ex.: cliente aberto a partir do parceiro)

function novoCliente(parceiro) {

// comissão: um único percentual no texto ("10% do setup", "5% da mensalidade") é calculado sobre os contratos ativos;
// sem % (ou com mais de um) o texto só é exibido
function percentualComissao(t) {
  const ps = [...String(t || '').matchAll(/(\d+(?:[.,]\d+)?)\s*%/g)];
  return ps.length === 1 ? { p: Number(ps[0][1].replace(',', '.')) / 100, mensal: /mensal/i.test(t) } : null;
}
// totais calculados na hora, no topo da ficha do parceiro
function totaisParceiro(r) {
  const lc = listaDo('clientes'), filhos = clientesDe(r);
  if (!lc) return null;
  const colNum = re => lc.colunas.find(c => c.tipo === 'numero' && re.test(c.nome));
  const soma = (rs, c) => c ? rs.reduce((s, x) => s + (typeof x[c.nome] === 'number' ? x[c.nome] : 0), 0) : 0;
  const ganhas = lc.etapas.filter(e => e.tipo === 'ganha').map(e => e.nome);
  const ativos = filhos.filter(x => etapaNa(lc, x)?.tipo === 'ganha');
  const diagnostico = filhos.filter(x => /diagn/i.test(x[colTipo(lc, 'etapa').nome] || ''));
  const mensal = soma(ativos, colNum(/mensal/i)), setup = soma(ativos, colNum(/setup/i));
  const cc = L().colunas.find(c => /comiss/i.test(c.nome)), txt = cc ? String(r[cc.nome] ?? '').trim() : '';
  const pc = percentualComissao(txt);
  let comissao;
  if (pc) {
    comissao = tile('Comissão a pagar', brl(pc.p * (pc.mensal ? mensal : setup)) + (pc.mensal ? '/mês' : ''), txt,
      `${num(pc.p * 100, 2)}% × ${pc.mensal ? `mensalidades (${brl(mensal)}/mês)` : `setup (${brl(setup)})`} dos ${ativos.length} contrato(s) ativo(s)`);
  } else {
    comissao = tile('Comissão combinada', txt || '–', txt ? 'texto livre: não calculada' : 'preencha "Comissão combinada"');
    comissao.classList.add('texto');
  }
  return el('div', { className: 'tiles p-tiles' },
    tile('Clientes indicados', filhos.length),
    tile('Em diagnóstico', diagnostico.length, 'etapas com "diagnóstico"'),
    tile('Contrato ativo', ativos.length, ganhas.join(' ou ')),
    tile('Mensalidades', brl(mensal) + '/mês', 'dos contratos ativos'),
    comissao);
}
function clientesDoParceiro(r) {
  const lc = listaDo('clientes'), filhos = clientesDe(r);
  if (!lc) return null;
  const ce = colTipo(lc, 'etapa').nome;
  const valores = x => lc.colunas.filter(c => c.tipo === 'numero' && typeof x[c.nome] === 'number').map(c => `${c.nome}: ${brl(x[c.nome])}`).join(' · ');
  const linhas = filhos.map(x => {

// ---------- importar lista de parceiros ----------
// Uma linha por parceiro, como copiada de uma planilha: nome e, no fim, o telefone (separado por tab, ";" ou espaços).
// O telefone vira um contato do parceiro. Cabeçalho ("Contabilidade  Telefone") e nomes que já existem são pulados.
function linhasImportacao(texto) {
  const linhas = texto.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (linhas.length && /telefone/i.test(linhas[0]) && !/\d/.test(linhas[0])) linhas.shift(); // cabeçalho
  return linhas.map(x => {
    const m = /^(.*?)[\s;,]+(\+?[\d\s().-]+)$/.exec(x);
    return m && m[2].replace(/\D/g, '').length >= 8 ? { nome: m[1].trim(), telefone: m[2].trim() } : { nome: x.replace(/[\s;,]+$/, ''), telefone: '' };
  }).filter(x => x.nome);
}
function abrirImportar() {
  const l = L(), d = $('#dlgImportar'), p = PAPEIS[l.papel];
  const cs = l.colunas.find(c => c.tipo === 'selecao' && /^segmento/i.test(c.nome));
  const seg = cs ? selecao(cs.opcoes, cs.opcoes[0]) : null;
  const texto = el('textarea', { placeholder: 'Escritório Exemplo Contabilidade\t11999990000\nOutro Escritório\t1133334444' });
  const previa = el('p', { className: 'imp-previa' }), botao = el('button', { type: 'button', className: 'primario', textContent: 'Importar', disabled: true });
  const existentes = new Set(l.registros.map(r => norm(nomeReg(l, r)).trim()));
  let novos = [];
  const atualizar = () => {
    const vistos = new Set(), pulados = [], porTelefone = new Map();
    novos = [];
    for (const x of linhasImportacao(texto.value)) {
      const k = norm(x.nome);
      if (existentes.has(k) || vistos.has(k)) { pulados.push(x.nome); continue; }
      vistos.add(k); novos.push(x);
      const t = x.telefone.replace(/\D/g, '');
      if (t) (porTelefone.get(t) || porTelefone.set(t, []).get(t)).push(x.nome);
    }
    const mesmoTel = [...porTelefone.values()].filter(v => v.length > 1).map(v => v.join(' e '));
    previa.textContent = !texto.value.trim() ? '' : [`${novos.length} ${p.singular}(s) novo(s), ${novos.filter(x => x.telefone).length} com telefone.`,
      pulados.length ? `Já existem, não serão importados: ${pulados.join(', ')}.` : null,
      mesmoTel.length ? `Atenção, mesmo telefone em: ${mesmoTel.join('; ')}.` : null].filter(Boolean).join('\n');
    botao.textContent = `Importar ${novos.length}`; botao.disabled = !novos.length;
  };
  texto.oninput = atualizar;
  botao.onclick = () => {
    const cn = l.colunas[0].nome;
    for (const x of [...novos].reverse()) { // unshift ao contrário: fica na ordem colada, no topo da lista
      const r = registroNovo(l);
      r[cn] = x.nome;
      if (seg?.value) r[cs.nome] = seg.value;
      l.registros.unshift(r);
      if (x.telefone) D.contatos.push({ _id: novoId(), tipo: p.singular, ref: r._id, telefone: x.telefone });
    }
    d.close(); render(); salvar();
    toast(`${novos.length} ${p.singular}(s) importado(s) em "${etapaPadraoDe(l)}".`, false);
  };
  d.replaceChildren(
    el('div', { className: 'g-topo' }, el('h2', { textContent: `Importar lista — ${l.nome}` }), el('button', { textContent: 'Fechar', onclick: () => d.close() })),
    el('div', { className: 'imp-corpo' },
      el('p', { textContent: `Cole uma linha por ${p.singular}: nome e telefone no fim (pode copiar duas colunas de uma planilha). Entram na etapa "${etapaPadraoDe(l)}"; o telefone vira um contato.` }),
      texto, seg ? el('label', {}, `${cs.nome}:`, seg) : null, previa,
      el('div', { className: 'botoes' }, el('button', { type: 'button', textContent: 'Cancelar', onclick: () => d.close() }), botao)));
  d.showModal();
  texto.focus();
}

// ---------- contatos ----------
const CAMPOS_CONTATO = [['nome', 'Nome', 'text'], ['cargo', 'Cargo', 'text'], ['telefone', 'Telefone', 'tel'], ['email', 'E-mail', 'email'], ['obs', 'Observação', 'text']];
const contatosDe = (tipo, id) => (D.contatos || []).filter(k => k.tipo === tipo && k.ref === id);
function linksContato(k) {

}
function editorContatos(tipo, r) {

function renderAbas() {
  $('#abas').replaceChildren(...D.listas.map((l, i) => el('button', {

    onclick: () => { atual = i; V = { busca: '', filtros: {}, ordem: null, dir: 1, agrupar: V.agrupar }; $('#busca').value = ''; render(); }
  })));
}

function chave(r, c) {
  if (c.tipo === 'dias_na_etapa') return dias(r[colDo('etapa_desde').nome]);
  const v = r[c.nome];
  if (v == null || v === '') return null;
  if (c.tipo === 'etapa') { const i = L().etapas.findIndex(e => e.nome === v); return i < 0 ? 999 : i; }
  if (c.tipo === 'caixa') return v ? 1 : 0;
  if (c.tipo === 'servicos') { const s = somaItens(v); return s.unico + s.mensal; }
  if (c.tipo === 'vinculo') return textoDe(r, c);
  return v;
}
function comparar(a, b, c) {
  const x = chave(a, c), y = chave(b, c);
  if (x == null || y == null) return x == null && y == null ? 0 : x == null ? 1 : -1; // vazios sempre no fim
  const r = typeof x === 'string' && typeof y === 'string'
    ? x.localeCompare(y, 'pt-BR', { sensitivity: 'base', numeric: true }) : (x < y ? -1 : x > y ? 1 : 0);
  return r * V.dir;
}
function passa(r) {
  const cols = L().colunas.filter(c => c.visivel || c.tipo === 'etapa');
  if (V.busca && !cols.some(c => norm(textoDe(r, c)).includes(norm(V.busca)))) return false;
  for (const [nome, f] of Object.entries(V.filtros)) {
    const c = L().colunas.find(c => c.nome === nome);
    if (!c || !f.length) continue;
    if (Array.isArray(f)) { // vários valores marcados na mesma coluna: basta bater com um deles
      if (!valoresFiltro(r, c).some(v => f.includes(v))) return false;
    } else if (!norm(textoDe(r, c)).includes(norm(f))) return false;
  }
  return true;
}

function filtro(c) {
  const f = V.filtros[c.nome] ?? '';
  const mudou = e => { V.filtros[c.nome] = e.target.value; renderCorpo(); };
  if (c.tipo === 'dias_na_etapa') return el('input', { className: 'filtro', value: f, oninput: mudou });
  if (['selecao', 'etapa', 'caixa', 'servicos', 'vinculo'].includes(c.tipo)) {
    const b = el('button', { className: 'filtro multi', type: 'button' });
    b.onclick = () => abrirMenuFiltro(c, b);
    rotuloFiltro(c, b);
    return b;
  }
  return el('input', { className: 'filtro', value: f, placeholder: 'filtrar', oninput: mudou });
}

const ROTULO_VAZIO = '(vazio)';
const rotuloValor = (c, v) => v === '__vazio' ? ROTULO_VAZIO : c.tipo === 'vinculo' ? rotuloVinculo(L(), v) : v;
function rotuloFiltro(c, b) {
  const f = V.filtros[c.nome] || [];
  const nomes = f.map(v => rotuloValor(c, v));
  b.textContent = !f.length ? '(todos)' : f.length === 1 ? nomes[0] : `${nomes[0]} +${f.length - 1}`;
  b.title = f.length ? 'Mostrando: ' + nomes.join(', ') : 'Filtrar por um ou mais valores';
  b.classList.toggle('ativo', f.length > 0);
}
// lista de caixas de marcar (popover, para não ser cortada pela rolagem da tabela)
function abrirMenuFiltro(c, b) {
  const m = $('#menuFiltro');
  const ops = c.tipo === 'caixa' ? ['sim', 'não'] : c.tipo === 'etapa' ? L().etapas.map(e => e.nome) : c.tipo === 'servicos' ? nomesServicos(c) : c.tipo === 'vinculo' ? idsVinculo(c) : c.opcoes;
  const valores = [...ops, ...(c.tipo === 'caixa' ? [] : ['__vazio'])];
  const marcados = () => V.filtros[c.nome] || [];
  const contagem = v => L().registros.filter(r => valoresFiltro(r, c).includes(v)).length;
  const aplicar = lista => { V.filtros[c.nome] = lista; rotuloFiltro(c, b); renderCorpo(); };
  const desenhar = () => m.replaceChildren(
    el('div', { className: 'mf-topo' },
      el('button', { type: 'button', textContent: 'Todos', onclick: () => { aplicar([...valores]); desenhar(); } }),
      el('button', { type: 'button', textContent: 'Limpar', onclick: () => { aplicar([]); desenhar(); } })),
    ...valores.map(v => el('label', {},
      el('input', { type: 'checkbox', checked: marcados().includes(v), onchange: ev => {
        aplicar(ev.target.checked ? [...marcados(), v] : marcados().filter(x => x !== v));
      } }),
      el('span', { textContent: rotuloValor(c, v) }),
      el('small', { textContent: contagem(v) }))));
  desenhar();
  const r = b.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - 260) + 'px';
  m.style.top = (r.bottom + 2) + 'px';
  m.style.minWidth = Math.max(r.width, 220) + 'px';
  m.showPopover();
}

function renderCabecalho() {
  const cols = L().colunas.filter(c => c.visivel);
  const titulos = cols.map(c => el('th', {

      renderCabecalho(); renderCorpo();

  $('#cabecalho').replaceChildren(

    el('tr', {}, ...cols.map(c => el('th', {}, filtro(c))), el('th', {})));

  $('#filtrosCel').replaceChildren(...[colDo('etapa'), colServicos(), colVinculo()].filter(Boolean).map(c => el('span', {}, c.nome, filtro(c))));

function renderCorpo() {
  const l = L(), cols = l.colunas.filter(c => c.visivel), ce = colDo('etapa').nome;
  let rs = l.registros.filter(passa);
  const c = l.colunas.find(c => c.nome === V.ordem);
  if (c) rs.sort((a, b) => comparar(a, b, c));
  // grupos: [{ nome, cor, regs }]; sem "Agrupar por etapa", um grupo só sem título
  let grupos = [{ nome: null, regs: rs }];
  if (V.agrupar) {
    const nomes = l.etapas.map(e => e.nome);

  }
  const vazio = l.registros.length ? 'Nenhum registro com esses filtros.' : 'Nenhum registro ainda. Clique em "+ Registro".';
  const bolinha = g => { const b = el('span', { className: 'bolinha' }); b.style.background = g.cor; return b; };
  const corpo = $('#corpo'), cartoes = $('#cartoes');
  corpo.replaceChildren(); cartoes.replaceChildren();
  if (celular.matches) {
    for (const g of grupos) {
      if (g.nome != null) cartoes.append(el('div', { className: 'grupo-cel' }, bolinha(g), g.nome || '(sem etapa)', el('span', { className: 'n', textContent: g.regs.length })));

// registro em cartão (celular): nome, etapa, serviços, próxima ação e links; toque abre a ficha

// vermelho = atrasado; âmbar = venda ativa sem próxima ação ou perdido sem motivo (só aviso, não bloqueia)

function selecao(opcoes, v, onchange) {

// cria a opção na coluna (vale para todos os registros) e já aplica neste
async function novaOpcaoNaCelula(r, c, s) {
  s.value = r[c.nome] ?? '';

function pintar(s, nome) {

function editar(r, c, valor) {

// Refaz as células de telefone e URL da linha, para os botões (WhatsApp, Abordagem, ↗)

// parceiro: os clientes ligados NÃO são apagados (ficam como "parceiro removido"); os contatos do registro vão junto

// ---------- listas ----------
function erroNomeLista(nome, ignorar) {
  if (!nome) return 'Informe o nome.';
  if (nome.length > 31) return 'O nome da lista pode ter no máximo 31 caracteres (limite do Excel).';
  if (/[\[\]:*?\/\\]/.test(nome) || nome.startsWith('_') || nome.startsWith("'") || nome.endsWith("'")) return 'O nome não pode ter [ ] : * ? / \\ nem começar com _.';
  if (D.listas.some(l => l !== ignorar && mesmoNome(l.nome, nome))) return `Já existe a lista "${nome}".`;
  return null;
}
async function novaLista() {
  const nome = await pedirTexto('Nome da nova lista (vira uma aba no Excel):');
  if (nome === null) return;
  const erro = erroNomeLista(nome);
  if (erro) return toast(erro);
  D.listas.push({ nome, registros: [],
    colunas: [['Nome', 'texto'], ['Etapa', 'etapa'], ['Próxima ação', 'proxima_acao'], ['Data da próxima ação', 'data_proxima_acao'], ['Etapa desde', 'etapa_desde'], ['Dias na etapa', 'dias_na_etapa']]
      .map(([nome, tipo]) => ({ nome, tipo, opcoes: [], visivel: true })),
    etapas: [{ nome: 'Novo', tipo: 'aberta', cor: '#60a5fa' }, { nome: 'Ganho', tipo: 'ganha', cor: '#22c55e' }, { nome: 'Perdido', tipo: 'perdida', cor: '#ef4444' }] });
  atual = D.listas.length - 1; V.filtros = {}; V.ordem = null;
  render(); salvar();
}
async function renomearLista() {
  const nome = await pedirTexto('Novo nome da lista:', L().nome);
  if (nome === null || nome === L().nome) return;
  const erro = erroNomeLista(nome, L());
  if (erro) return toast(erro);
  L().nome = nome; render(); salvar();
}

// ---------- gerenciador de colunas e etapas ----------
function erroNome(nome, existentes, oQue) {
  if (!nome) return `Informe o nome da ${oQue}.`;
  if (existentes.some(x => mesmoNome(x, nome))) return `Já existe ${oQue} "${nome}".`;
  return null;
}
function usam(c, valor) { return L().registros.filter(r => r[c.nome] === valor).length; }
function mudou() { salvar(); renderGerenciador(); }
function mover(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; mudou(); }
function setas(arr, i) {
  return el('td', { className: 'mover' },
    el('button', { textContent: '↑', title: 'Subir', disabled: i === 0, onclick: () => mover(arr, i, -1) }),
    el('button', { textContent: '↓', title: 'Descer', disabled: i === arr.length - 1, onclick: () => mover(arr, i, 1) }));
}
// input que, ao mudar, chama fn(novoValor); se fn devolver erro, volta o valor antigo e avisa
function campo(valor, fn) {
  const e = el('input', { type: 'text', value: valor, onchange: () => {
    const erro = fn(e.value.trim());
    if (erro) { toast(erro); e.value = valor; }
  } });
  return e;
}

function renomearColuna(c, novo) {
  if (novo === c.nome) return;
  const erro = erroNome(novo, L().colunas.filter(x => x !== c).map(x => x.nome), 'coluna');
  if (erro) return erro;
  if (novo.startsWith('_')) return 'O nome da coluna não pode começar com _.';
  for (const r of L().registros) if (c.nome in r) { r[novo] = r[c.nome]; delete r[c.nome]; }
  if (V.ordem === c.nome) V.ordem = novo;
  if (c.nome in V.filtros) { V.filtros[novo] = V.filtros[c.nome]; delete V.filtros[c.nome]; }
  c.nome = novo; mudou();
}

function converter(v, de, para) { // devolve undefined quando não dá para converter
  const t = TIPOS_DATA.includes(de) ? br(v) : de === 'caixa' ? (v ? 'Sim' : '') : String(v);
  if (para === 'numero') return deNumero(t);
  if (para === 'data') return ehData(v) ? v : deBR(t);
  if (para === 'caixa') return ['sim', 's', 'x', 'true', 'verdadeiro', '1', 'ok'].includes(norm(t.trim()));
  return t || null;
}
async function mudarTipo(c, tipo) {
  const valores = L().registros.filter(r => r[c.nome] != null);
  const perdidos = valores.filter(r => converter(r[c.nome], c.tipo, tipo) === undefined).length;
  if (perdidos && !await confirmar(`${perdidos} valor(es) da coluna "${c.nome}" não podem ser convertidos para ${TIPOS[tipo]} e serão apagados. Continuar?`))
    return renderGerenciador();
  for (const r of valores) {
    const x = converter(r[c.nome], c.tipo, tipo);
    if (x == null || x === false) delete r[c.nome]; else r[c.nome] = x;
  }
  if (tipo === 'selecao') for (const r of valores) if (r[c.nome] && !c.opcoes.includes(r[c.nome])) c.opcoes.push(r[c.nome]);
  c.tipo = tipo; mudou();
}
async function apagarColuna(c) {
  const n = L().registros.filter(r => r[c.nome] != null).length;
  if (!await confirmar(`Apagar a coluna "${c.nome}"?` + (n ? `\nOs dados dela em ${n} registro(s) serão perdidos.` : ''))) return;
  L().colunas = L().colunas.filter(x => x !== c);
  L().registros.forEach(r => delete r[c.nome]);
  delete V.filtros[c.nome];
  if (V.ordem === c.nome) V.ordem = null;
  mudou();
}
function adicionarColuna(nome, tipo) {
  const erro = erroNome(nome, L().colunas.map(x => x.nome), 'coluna') || (nome.startsWith('_') ? 'O nome da coluna não pode começar com _.' : null)
    || (tipo === 'servicos' && colServicos() ? `Esta lista já tem a coluna de serviços "${colServicos().nome}".` : null);
  if (erro) return toast(erro);
  L().colunas.push({ nome, tipo, opcoes: [], visivel: true, ...(tipo === 'servicos' ? { servicos: [] } : {}) }); mudou();
}

// catálogo da coluna de serviços
const usoServico = (c, nome) => L().registros.filter(r => (r[c.nome] || []).some(i => i.servico === nome)).length;
function renomearServico(c, s, novo) {
  if (novo === s.nome) return;
  const erro = erroNome(novo, c.servicos.filter(x => x !== s).map(x => x.nome), 'serviço');
  if (erro) return erro;
  for (const r of L().registros) for (const i of r[c.nome] || []) if (i.servico === s.nome) i.servico = novo;
  if (Array.isArray(V.filtros[c.nome])) V.filtros[c.nome] = V.filtros[c.nome].map(x => x === s.nome ? novo : x);
  if (c.padrao === s.nome) c.padrao = novo;
  s.nome = novo; mudou();
}
function apagarServico(c, s) {
  const n = usoServico(c, s.nome);
  if (n) return toast(`${n} registro(s) têm "${s.nome}". Remova dos registros (ou renomeie o serviço) antes de apagar.`);
  c.servicos = c.servicos.filter(x => x !== s);
  if (c.padrao === s.nome) delete c.padrao;
  mudou();
}
function adicionarServico(c, nome, cobranca, preco) {
  const erro = erroNome(nome, c.servicos.map(x => x.nome), 'serviço') || (preco === undefined ? 'Preço inválido.' : null);
  if (erro) return toast(erro);
  c.servicos.push({ nome, cobranca, preco }); mudou();
}
function selCobranca(valor, onchange) {
  const s = el('select', { onchange }, ...Object.entries(COBRANCA).map(([v, t]) => el('option', { value: v, textContent: t })));
  s.value = valor === 'mensal' ? 'mensal' : 'unico';
  return s;
}
function linhaCatalogo(c) {

  const nome = el('input', { type: 'text', placeholder: 'Novo serviço' }), cob = selCobranca('unico'), preco = el('input', { type: 'text', className: 'curto', placeholder: 'preço', inputMode: 'decimal' });
  return el('tr', { className: 'opcoes' }, el('td', { colSpan: 7 },
    el('p', { className: 'sis', textContent: 'O preço sugerido entra ao incluir o serviço num registro e pode ser mudado em cada negociação. Mudar aqui não altera valores já lançados.' }),
    el('table', {}, ...c.servicos.map((s, j) => el('tr', {}, setas(c.servicos, j),
      el('td', {}, campo(s.nome, novo => renomearServico(c, s, novo))),
      el('td', {}, selCobranca(s.cobranca, ev => { s.cobranca = ev.target.value; mudou(); })),
      el('td', {}, el('input', { type: 'text', className: 'curto', inputMode: 'decimal', placeholder: 'preço', title: 'Preço sugerido (R$); vazio = a definir em cada venda',
        value: typeof s.preco === 'number' ? String(s.preco).replace('.', ',') : '', onchange: ev => {
          const x = deNumero(ev.target.value);
          if (x === undefined) { toast('Preço inválido.'); ev.target.value = typeof s.preco === 'number' ? String(s.preco).replace('.', ',') : ''; return; }
          s.preco = x; mudou();
        } })),
      el('td', { className: 'uso', textContent: usoServico(c, s.nome) + ' reg.' }),
      el('td', {}, el('button', { className: 'icone', textContent: '✕', title: 'Apagar serviço do catálogo', onclick: () => apagarServico(c, s) }))))),
    el('form', { className: 'adicionar', onsubmit: ev => { ev.preventDefault(); adicionarServico(c, nome.value.trim(), cob.value, deNumero(preco.value)); } },
      nome, cob, preco, el('button', { textContent: 'Adicionar serviço' }))));
}

function renomearOpcao(c, i, novo) {
  const velho = c.opcoes[i];
  if (novo === velho) return;
  const erro = erroNome(novo, c.opcoes.filter((_, j) => j !== i), 'opção') || (novo.includes(';') ? 'A opção não pode ter ";".' : null);
  if (erro) return erro;
  L().registros.forEach(r => { if (r[c.nome] === velho) r[c.nome] = novo; });
  if (Array.isArray(V.filtros[c.nome])) V.filtros[c.nome] = V.filtros[c.nome].map(x => x === velho ? novo : x);
  c.opcoes[i] = novo; mudou();
}
async function apagarOpcao(c, i) {
  const n = usam(c, c.opcoes[i]);
  if (n && !await confirmar(`${n} registro(s) usam "${c.opcoes[i]}". O valor será apagado deles. Continuar?`)) return;
  L().registros.forEach(r => { if (r[c.nome] === c.opcoes[i]) delete r[c.nome]; });
  c.opcoes.splice(i, 1); mudou();
}
function adicionarOpcao(c, nome) {
  const erro = erroNome(nome, c.opcoes, 'opção') || (nome.includes(';') ? 'A opção não pode ter ";".' : null);
  if (erro) return toast(erro);
  c.opcoes.push(nome); mudou();
}

function renomearEtapa(e, novo) {
  if (novo === e.nome) return;
  const erro = erroNome(novo, L().etapas.filter(x => x !== e).map(x => x.nome), 'etapa');
  if (erro) return erro;
  const ce = colDo('etapa').nome;
  L().registros.forEach(r => { if (r[ce] === e.nome) r[ce] = novo; });
  if (Array.isArray(V.filtros[ce])) V.filtros[ce] = V.filtros[ce].map(x => x === e.nome ? novo : x);
  e.nome = novo; mudou();
}
async function apagarEtapa(e) {
  const l = L(), ce = colDo('etapa').nome, n = usam(colDo('etapa'), e.nome);
  if (l.etapas.length === 1) return toast('A lista precisa ter pelo menos uma etapa.');
  if (n) {
    const destino = await escolher(`${n} registro(s) estão na etapa "${e.nome}".\nPara qual etapa movê-los antes de apagar?`,
      l.etapas.filter(x => x !== e).map(x => x.nome));
    if (destino === null) return;
    l.registros.forEach(r => { if (r[ce] === e.nome) aplicarEtapa(r, destino); });
  } else if (!await confirmar(`Apagar a etapa "${e.nome}"?`)) return;
  l.etapas = l.etapas.filter(x => x !== e); mudou();
}
function adicionarEtapa(nome) {
  const erro = erroNome(nome, L().etapas.map(x => x.nome), 'etapa');
  if (erro) return toast(erro);
  const abertas = L().etapas.filter(e => e.tipo === 'aberta').length;
  L().etapas.splice(abertas, 0, { nome, tipo: 'aberta', cor: CORES[L().etapas.length % CORES.length] }); mudou();
}

function renderGerenciador() {
  const l = L(), g = $('#gerenciador');
  const linhasCol = [];
  l.colunas.forEach((c, i) => {
    const sis = c.tipo in SISTEMA, sv = c.tipo === 'servicos', vc = c.tipo === 'vinculo';
    const tipo = sis ? el('span', { className: 'sis', textContent: 'Coluna padrão (' + SISTEMA[c.tipo] + ')' })
      : sv ? el('span', { className: 'sis', textContent: 'Serviços vendidos (itens com valor)' })
      : vc ? el('span', { className: 'sis', textContent: `Vínculo com ${listaPai()?.nome || 'outra lista'} (guarda o _id)` })
      : el('select', { onchange: ev => mudarTipo(c, ev.target.value) }, ...Object.entries(TIPOS).filter(([v]) => v !== 'servicos').map(([v, t]) => el('option', { value: v, textContent: t })));
    if (!sis && !sv && !vc) tipo.value = c.tipo;
    let padrao = null;
    if (sv) { // serviço incluído automaticamente nos registros novos
      padrao = el('select', { title: 'Serviço incluído automaticamente nos registros novos', onchange: ev => { if (ev.target.value) c.padrao = ev.target.value; else delete c.padrao; mudou(); } },
        el('option', { value: '', textContent: '(nenhum)' }), ...(c.servicos || []).map(s => el('option', { value: s.nome, textContent: s.nome })));
      padrao.value = catalogo(c, c.padrao) ? c.padrao : '';
    } else if (!sis && !vc && !['data', 'caixa'].includes(c.tipo)) {
      padrao = el('input', { type: 'text', className: 'curto', value: c.padrao ?? '', placeholder: 'padrão',
        title: 'Valor preenchido automaticamente nos registros novos',
        onchange: ev => { const v = ev.target.value.trim(); if (!v) delete c.padrao; else c.padrao = c.tipo === 'numero' ? (deNumero(v) ?? v) : v; mudou(); } });
    }
    linhasCol.push(el('tr', {}, setas(l.colunas, i),
      el('td', {}, campo(c.nome, novo => renomearColuna(c, novo))),
      el('td', {}, tipo),
      el('td', {}, el('label', { title: 'Mostrar na tabela' }, el('input', { type: 'checkbox', checked: c.visivel, onchange: ev => { c.visivel = ev.target.checked; mudou(); } }), ' visível')),
      el('td', {}, padrao),
      el('td', {}, c.tipo === 'selecao' || sv ? el('button', { textContent: sv ? `Catálogo (${(c.servicos || []).length})` : `Opções (${c.opcoes.length})`,
        onclick: () => { opcoesAbertas = opcoesAbertas === c ? null : c; renderGerenciador(); } }) : null),
      el('td', {}, sis || vc ? null : el('button', { className: 'icone', textContent: '✕', title: 'Apagar coluna', onclick: () => apagarColuna(c) }))));
    if (opcoesAbertas === c && sv) linhasCol.push(linhaCatalogo(c));
    if (opcoesAbertas === c && c.tipo === 'selecao') {
      const novaOp = el('input', { type: 'text', placeholder: 'Nova opção' });
      linhasCol.push(el('tr', { className: 'opcoes' }, el('td', { colSpan: 7 },
        el('table', {}, ...c.opcoes.map((o, j) => el('tr', {}, setas(c.opcoes, j),
          el('td', {}, campo(o, novo => renomearOpcao(c, j, novo))),
          el('td', { className: 'uso', textContent: usam(c, o) + ' reg.' }),
          el('td', {}, el('button', { className: 'icone', textContent: '✕', title: 'Apagar opção', onclick: () => apagarOpcao(c, j) }))))),
        el('form', { className: 'adicionar', onsubmit: ev => { ev.preventDefault(); adicionarOpcao(c, novaOp.value.trim()); } },
          novaOp, el('button', { textContent: 'Adicionar opção' })))));
    }
  });
  const nomeCol = el('input', { type: 'text', placeholder: 'Nome da nova coluna' });
  const tipoCol = el('select', {}, ...Object.entries(TIPOS).map(([v, t]) => el('option', { value: v, textContent: t })));

  const ce = colDo('etapa');
  const linhasEtapa = l.etapas.map((e, i) => {
    const tipo = el('select', { onchange: ev => { e.tipo = ev.target.value; mudou(); } }, ...Object.entries(TIPOS_ETAPA).map(([v, t]) => el('option', { value: v, textContent: t })));
    tipo.value = e.tipo;
    return el('tr', {}, setas(l.etapas, i),
      el('td', {}, el('input', { type: 'color', value: e.cor, title: 'Cor', onchange: ev => { e.cor = ev.target.value; mudou(); } })),
      el('td', {}, campo(e.nome, novo => renomearEtapa(e, novo))),
      el('td', {}, tipo),
      el('td', {}, el('label', { title: 'Etapa depois da proposta: no funil, o % dela é calculado sobre o total de ofertas' },
        el('input', { type: 'checkbox', checked: !!e.oferta, onchange: ev => { e.oferta = ev.target.checked; mudou(); } }), ' oferta')),
      el('td', {}, e.tipo !== 'aberta' ? null : el('label', { title: 'Etapa de produção (antes do contato). Etapas abertas sem esta marca são de venda ativa.' },
        el('input', { type: 'checkbox', checked: !!e.producao, onchange: ev => { e.producao = ev.target.checked; mudou(); } }), ' produção')),
      el('td', {}, e.tipo !== 'aberta' ? null : el('input', { type: 'number', min: 1, className: 'curto', value: e.limite ?? '', placeholder: 'limite',
        title: 'Limite de dias nesta etapa: passou disso, o lead aparece em "Leads parados" na aba Hoje (vazio = sem limite)',
        onchange: ev => { const n = parseInt(ev.target.value, 10); e.limite = n > 0 ? n : null; mudou(); } })),
      el('td', { className: 'uso', textContent: usam(ce, e.nome) + ' reg.' }),
      el('td', {}, el('button', { className: 'icone', textContent: '✕', title: 'Apagar etapa', onclick: () => apagarEtapa(e) })));
  });
  const nomeEtapa = el('input', { type: 'text', placeholder: 'Nome da nova etapa' });

  g.replaceChildren(
    el('div', { className: 'g-topo' }, el('h2', { textContent: `Colunas e etapas — ${l.nome}` }), el('button', { textContent: 'Fechar', onclick: () => g.close() })),
    el('div', { className: 'g-corpo' },
      el('section', {}, el('h3', { textContent: 'Colunas' }), el('table', {}, ...linhasCol),
        el('form', { className: 'adicionar', onsubmit: ev => { ev.preventDefault(); adicionarColuna(nomeCol.value.trim(), tipoCol.value); } },
          nomeCol, tipoCol, el('button', { textContent: 'Adicionar coluna' }))),
      el('section', {}, el('h3', { textContent: 'Etapas' }), el('table', {}, ...linhasEtapa),
        el('form', { className: 'adicionar', onsubmit: ev => { ev.preventDefault(); adicionarEtapa(nomeEtapa.value.trim()); } },
          nomeEtapa, el('button', { textContent: 'Adicionar etapa' })))));
}

// ---------- ligações ----------
$('#btnRecarregar').onclick = () => carregar();
$('#btnSair').hidden = LOCAL;
$('#btnSair').onclick = async () => { if (await confirmar('Esquecer a chave de acesso neste aparelho?' + (sujo ? '\nHá alterações ainda não gravadas, que serão perdidas.' : ''))) sair(); };
function mostrarTema() { $('#btnTema').textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '☾'; }
$('#btnTema').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('tema', t); } catch (e) {}
  mostrarTema();
};
mostrarTema();
$('#vHoje').onclick = () => mudarVisao('hoje');
$('#vTabela').onclick = () => mudarVisao('tabela');
$('#vGraficos').onclick = () => mudarVisao('graficos');
$('#btnNovaLista').onclick = novaLista;
$('#btnRenomearLista').onclick = renomearLista;
$('#btnImportar').onclick = abrirImportar;
$('#btnNovo').onclick = novoRegistro;
$('#btnGerenciar').onclick = () => { opcoesAbertas = null; renderGerenciador(); $('#gerenciador').showModal(); };
$('#gerenciador').onclose = () => render();
$('#ficha').onclose = () => { fichaReg = null; render(); };
$('#dlgServicos').onclose = () => render();
celular.addEventListener('change', () => { if (D) render(); });
$('#busca').oninput = e => { V.busca = e.target.value; renderCorpo(); };
$('#agrupar').onchange = e => { V.agrupar = e.target.checked; renderCorpo(); };
$('#btnLimpar').onclick = () => { V.busca = ''; V.filtros = {}; $('#busca').value = ''; renderCabecalho(); renderCorpo(); };
window.addEventListener('beforeunload', e => { if (sujo) e.preventDefault(); });
carregar(false);
</script>
</body>
</html>
